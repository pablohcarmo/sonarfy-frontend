<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonarfy</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/meyer-reset/2.0/reset.min.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/footer.css">

<body>

<header>
    <button id="theme-toggle" class="theme-toggle-btn" aria-label="Alternar Tema">
        <i class="fa-solid fa-moon"></i>
    </button>
    <a href="#" class="logo-container">
        <img src="assets/images/sonarfy_logo.png" alt="Logo do Sonarfy" class="logo-img" id="main-logo">
        <i class="fa-solid fa-wave-square logo-icon-fallback" id="fallback-icon"></i>
        Sonarfy

    <div class="auth-buttons">
        <a href="pages/login.html" class="btn btn-login">Entrar</a>
        <a href="pages/cadastro.html" class="btn btn-signup">Criar Conta</a>
    </div>
</header>

<main>
    <h1 class="hero-title">A sua nova rede social de <span>Música</span></h1>
    <p class="hero-subtitle">
        Avalie álbuns, descubra novos artistas sincronizando com seu Spotify e conecte-se com pessoas que compartilham o mesmo gosto musical que você.
    </p>
    <div class="cta-container">
        <a href="pages/cadastro.html" class="btn btn-signup btn-large">Comece Agora</a>
        <a href="#about" class="btn btn-login btn-large">Saiba Mais</a>

<script src="js/global.js"></script>
