<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Perfil – Sonarfy</title>
    <link rel="icon" href="../assets/images/sonarfy-symbol.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="../css/profile.css">
    <link rel="stylesheet" href="../css/profile-activity.css">
    <link rel="stylesheet" href="../css/profile-dialogs.css">
    <script src="../js/login-theme.js"></script>
    <script type="module" src="../js/profile.js"></script>
</head>
<body>
    <a class="skip-link" href="#profile-main">Ir para o perfil</a>
    <header class="site-header profile-global-header">
        <button class="profile-icon-button mobile-menu" id="open-menu" aria-label="Abrir menu" aria-haspopup="dialog" aria-controls="profile-drawer"></button>
        <a href="../index.html" class="brand" aria-label="Sonarfy — página inicial"><svg width="118" height="32" viewBox="0 0 118 32" aria-hidden="true"><use href="../assets/logos/sonarfy-desktop.svg#logo"></use></svg></a>
        <button id="theme-toggle" class="profile-icon-button" aria-label="Ativar tema escuro" aria-pressed="false"><img class="theme-light-only" src="../assets/icons/shared/theme-moon.svg" alt=""><img class="theme-dark-only" src="../assets/icons/shared/theme-sun.svg" alt=""></button>
    </header>
    <div class="profile-layout">
        <aside id="profile-sidebar" class="profile-sidebar" aria-label="Menu principal"></aside>
        <main id="profile-main" class="profile-main" tabindex="-1">
            <p id="profile-demo" class="profile-notice" hidden>Demonstração local · alterações não são enviadas ao servidor. <a href="profile.html?handle=lucas_vinyl">Ver visitante</a> · <a href="profile.html">Ver perfil próprio</a></p>
            <p id="profile-status" class="profile-status" role="status" aria-live="polite"></p>
            <section id="profile-header" aria-label="Informações do perfil"></section>
            <nav class="profile-tabs" role="tablist" aria-label="Conteúdo do perfil">
                <button id="tab-activities" role="tab" aria-controls="panel-activities" aria-selected="true">Avaliações</button>
                <button id="tab-replies" role="tab" aria-controls="panel-replies" aria-selected="false" tabindex="-1">Respostas</button>
                <button id="tab-collection" role="tab" aria-controls="panel-collection" aria-selected="false" tabindex="-1">Coleção</button>
            </nav>
            <section id="panel-activities" role="tabpanel" aria-labelledby="tab-activities" tabindex="0"></section>
            <section id="panel-replies" role="tabpanel" aria-labelledby="tab-replies" tabindex="0" hidden></section>
            <section id="panel-collection" role="tabpanel" aria-labelledby="tab-collection" tabindex="0" hidden></section>
        </main>
    </div>
    <footer class="site-footer profile-footer"><nav class="footer-links" aria-label="Informações institucionais"><button data-unavailable="Termos de Uso">Termos de Uso</button><span aria-hidden="true">•</span><button data-unavailable="Privacidade">Privacidade</button><span aria-hidden="true">•</span><button data-unavailable="Diretrizes">Diretrizes</button><span aria-hidden="true">•</span><button data-unavailable="Apoie o Sonarfy">Apoie o Sonarfy</button></nav><p>© 2026 Sonarfy</p></footer>
    <dialog id="profile-drawer" class="profile-drawer" aria-label="Menu principal"></dialog>
    <dialog id="profile-dialog" class="profile-dialog" aria-labelledby="dialog-title"></dialog>
</body>
</html>
