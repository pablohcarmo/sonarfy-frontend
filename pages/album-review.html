<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Avaliar Álbum – Sonarfy</title>
    <link rel="icon" href="../assets/images/sonarfy-symbol.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="../css/profile.css">
    <link rel="stylesheet" href="../css/profile-dialogs.css">
    <link rel="stylesheet" href="../css/album-review.css">
    <script src="../js/api.js"></script>
    <script src="../js/login-theme.js"></script>
    <script type="module" src="../js/album-review.js"></script>
</head>
<body class="album-review-page">
    <a class="skip-link" href="#album-review-main">Ir para avaliação do álbum</a>
    <header class="site-header profile-global-header"></header>
    <div class="profile-layout album-review-layout">
        <aside id="profile-sidebar" class="profile-sidebar" aria-label="Menu principal"></aside>
        <main id="album-review-main" class="profile-main album-review-main" tabindex="-1">
            <p id="album-review-demo" class="profile-notice" hidden>Demonstração local · avaliação simulada para visualização.</p>
            <p id="album-review-status" class="profile-status" role="status" aria-live="polite"></p>
            <section id="album-review-content" aria-label="Avaliar álbum"></section>
        </main>
    </div>
    <dialog id="profile-drawer" class="profile-drawer" aria-label="Menu principal"></dialog>
    <dialog id="review-success-dialog" class="review-success-dialog" aria-labelledby="review-success-title"></dialog>
    <footer class="site-footer profile-footer"></footer>
</body>
</html>
