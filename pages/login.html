<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Login – Sonarfy</title>
    <link rel="icon" type="image/png" href="../assets/images/sonarfy-symbol.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/login.css">
    <script src="../js/login-theme.js"></script>
    <script src="../js/api.js" defer></script>
    <script src="../js/login.js" defer></script>
</head>
<body>
    <header class="site-header">
        <a href="../index.html" class="brand" aria-label="Sonarfy — página inicial">
            <svg class="brand-desktop" width="118" height="32" viewBox="0 0 118 32" role="img" aria-label="Sonarfy" focusable="false"><use href="../assets/logos/sonarfy-desktop.svg#logo"></use></svg><svg class="brand-mobile" width="95" height="24" viewBox="0 0 95 24" role="img" aria-label="Sonarfy" focusable="false"><use href="../assets/logos/sonarfy-mobile.svg#logo"></use></svg>
        </a>
        <nav class="header-actions" aria-label="Navegação principal">
            <button id="theme-toggle" class="icon-button" type="button" aria-label="Ativar tema escuro" aria-pressed="false">
                <svg class="ui-icon theme-light-only" fill="none" width="14.99" height="20" viewBox="0 0 14.99 20" aria-hidden="true" focusable="false"><use href="../assets/icons/shared/theme-moon.svg#icon"></use></svg>
                <svg class="ui-icon theme-dark-only" fill="none" width="16.668" height="20" viewBox="0 0 16.668 20" aria-hidden="true" focusable="false"><use href="../assets/icons/shared/theme-sun.svg#icon"></use></svg>
            </button>
            <a class="back-link mobile-home" href="../index.html">
                <svg class="ui-icon" fill="none" width="9.334" height="16" viewBox="0 0 9.334 16" aria-hidden="true" focusable="false"><use href="../assets/icons/login/arrow-back.svg#icon"></use></svg>Início
            </a>
        </nav>
    </header>
    <main class="auth-container">
        <div class="login-content">
            <a class="back-link desktop-home" href="../index.html">
                <svg class="ui-icon" fill="none" width="9.334" height="16" viewBox="0 0 9.334 16" aria-hidden="true" focusable="false"><use href="../assets/icons/login/arrow-back.svg#icon"></use></svg>Voltar ao início
            </a>
            <form id="loginForm" class="login-card" method="post" aria-labelledby="login-title" aria-describedby="login-description" novalidate>
                <div class="form-introduction">
                    <h1 id="login-title">Bem-vindo de volta</h1>
                    <p id="login-description">Entre para continuar avaliando seus álbuns favoritos.</p>
                </div>
                <p id="errorMessage" class="feedback feedback-error" role="alert"></p>
                <p id="successMessage" class="feedback feedback-success" role="status"></p>
                <div class="credentials">
                    <div class="input-group">
                        <label for="loginField">E-mail ou Nome de Usuário</label>
                        <input id="loginField" name="login" class="login-field" type="text" placeholder="seu@email.com ou @usuario" required autocomplete="username" autocapitalize="none" spellcheck="false" aria-describedby="loginField-error">
                        <span id="loginField-error" class="field-error" hidden></span>
                    </div>
                    <div class="input-group">
                        <label for="passwordField">Senha</label>
                        <div class="password-input-wrapper">
                            <input id="passwordField" name="password" class="login-field" type="password" placeholder="Digite sua senha" required autocomplete="current-password" aria-describedby="passwordField-error">
                            <button type="button" id="btnTogglePassword" class="icon-button btn-toggle-password" aria-label="Mostrar senha" aria-controls="passwordField" aria-pressed="false" title="Mostrar senha">
                                <svg class="ui-icon eye-open" fill="none" width="16.668" height="20" viewBox="0 0 16.668 20" aria-hidden="true" focusable="false"><use href="../assets/icons/login/eye-open.svg#icon"></use></svg><svg class="ui-icon eye-off" fill="none" width="16.668" height="20" viewBox="0 0 16.668 20" aria-hidden="true" focusable="false"><use href="../assets/icons/login/eye-off.svg#icon"></use></svg>
                            </button>
                        </div>
                        <span id="passwordField-error" class="field-error" hidden></span>
                    </div>
                </div>
                <div class="login-options">
                    <label class="checkbox-container" for="rememberMeCheckbox">
                        <input type="checkbox" id="rememberMeCheckbox" name="remember"><svg class="checkbox-check ui-icon" fill="none" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><use href="../assets/icons/login/checkmark.svg#icon"></use></svg><span>Lembrar meu usuário</span>
                    </label>
                    <a href="recuperar-senha.html">Esqueci minha senha</a>
                </div>
                <button id="btnSubmitLogin" class="btn-submit" type="submit">Entrar</button>
                <p class="auth-links">Ainda não tem uma conta? <a href="register.html">Criar conta</a></p>
            </form>
        </div>
    </main>
    <footer class="site-footer">
        <nav class="footer-links" aria-label="Links institucionais">
            <a href="termos.html">Termos de Uso</a><span aria-hidden="true">•</span>
            <a href="privacidade.html">Privacidade</a><span aria-hidden="true">•</span>
            <a href="regulamentos.html">Diretrizes</a><span aria-hidden="true">•</span>
            <a href="apoio.html">Apoie o Sonarfy</a>
        </nav>
        <p>© 2026 Sonarfy</p>
    </footer>
</body>
</html>
